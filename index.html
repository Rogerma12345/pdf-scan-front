<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>PDF 扫描风生成器（纯前端）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 16px;
      line-height: 1.5;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 0.5rem;
    }
    .panel {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin: 8px 0 4px;
    }
    input[type="file"],
    input[type="text"],
    input[type="number"],
    select {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      margin-bottom: 8px;
    }
    /* Style for checkbox label */
    label.inline-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      width: auto;
    }
    button {
      padding: 8px 16px;
      border-radius: 4px;
      border: 1px solid #333;
      background: #222;
      color: #fff;
      cursor: pointer;
      font-size: 0.95rem;
    }
    button:disabled {
      opacity: 0.6;
      cursor: default;
    }
    #log {
      font-size: 0.9rem;
      white-space: pre-line;
      margin-top: 8px;
    }
    progress {
      width: 100%;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <h1>PDF 扫描风生成器（纯前端）</h1>
  <div class="panel">
    <label for="pdfFile">选择 PDF 文件（仅本地，不上传）：</label>
    <input id="pdfFile" type="file" accept="application/pdf" />

    <label for="scale">渲染缩放（数值越大越清晰，内存也更高，建议 1.5~2.5）：</label>
    <input id="scale" type="number" value="2" step="0.25" min="1" max="3" />

    <label for="tint">泛黄效果 (0-100):</label>
    <input id="tint" type="range" min="0" max="100" value="0" />

    <label class="inline-label">
      <input id="rotation" type="checkbox" checked />
      开启随机旋转
    </label>
    <hr style="border: none; border-top: 1px solid #eee; margin: 16px 0;" />

    <label for="watermarkLines">水印行数 (0-3):</label>
    <input id="watermarkLines" type="number" value="0" min="0" max="3" />
    <div id="watermarkInputs"></div>

    <hr style="border: none; border-top: 1px solid #eee; margin: 16px 0;" />
    
    <label for="cdnSelector">CDN 源 (若加载缓慢或失败可切换):</label>
    <select id="cdnSelector">
      <option value="jsdelivr">jsDelivr (默认)</option>
      <option value="unpkg">Unpkg (备用)</option>
    </select>

    <button id="startBtn">生成扫描风 PDF</button>
    <progress id="progress" value="0" max="1" style="display: none;"></progress>
    <div id="log"></div>
  </div>

  <script>
    // --- 动态库加载器 ---
    (function() {
      const cdnConfigs = {
        jsdelivr: {
          jspdf: 'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js',
          pdfjs: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.269/build/pdf.min.mjs',
          pdfjsWorker: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.269/build/pdf.worker.min.mjs'
        },
        unpkg: {
          jspdf: 'https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js',
          pdfjs: 'https://unpkg.com/pdfjs-dist@4.0.269/build/pdf.min.mjs',
          pdfjsWorker: 'https://unpkg.com/pdfjs-dist@4.0.269/build/pdf.worker.min.mjs'
        }
      };

      const selector = document.getElementById('cdnSelector');
      const storedCdn = localStorage.getItem('pdfScanCdn') || 'jsdelivr';
      selector.value = storedCdn;

      selector.addEventListener('change', () => {
        localStorage.setItem('pdfScanCdn', selector.value);
        alert('CDN 源已切换，页面将重新加载。');
        location.reload();
      });

      const config = cdnConfigs[storedCdn];
      window.pdfJsConfig = { url: config.pdfjs, workerUrl: config.pdfjsWorker };

      const jspdfScript = document.createElement('script');
      jspdfScript.src = config.jspdf;
      jspdfScript.onload = () => {
        const mainModule = document.createElement('script');
        mainModule.type = 'module';
        mainModule.innerHTML = `
          let pdfjsLib = null;
          window.libsLoaded = false;

          async function initializeApp() {
            try {
              const pdfjsModule = await import(window.pdfJsConfig.url);
              pdfjsLib = pdfjsModule;
              pdfjsLib.GlobalWorkerOptions.workerSrc = window.pdfJsConfig.workerUrl;
              if (typeof window.jspdf === 'undefined') throw new Error('jsPDF library failed to load.');
              window.libsLoaded = true;
              console.log('核心库加载成功!');
            } catch (error) {
              console.error('核心库加载失败:', error);
            }
          }

          const fileInput = document.getElementById("pdfFile");
          const scaleInput = document.getElementById("scale");
          const tintInput = document.getElementById("tint");
          const rotationInput = document.getElementById("rotation");
          const watermarkLinesInput = document.getElementById("watermarkLines");
          const watermarkInputsContainer = document.getElementById("watermarkInputs");
          const startBtn = document.getElementById("startBtn");
          const progressEl = document.getElementById("progress");
          const logEl = document.getElementById("log");

          watermarkLinesInput.addEventListener('input', () => {
            const lineCount = Math.max(0, Math.min(3, parseInt(watermarkLinesInput.value, 10) || 0));
            watermarkInputsContainer.innerHTML = '';
            for (let i = 1; i <= lineCount; i++) {
              const input = document.createElement('input');
              input.type = 'text';
              input.placeholder = \`水印文字第 \${i} 行\`;
              input.className = 'watermark-text';
              watermarkInputsContainer.appendChild(input);
            }
          });

          function log(msg) { logEl.textContent = msg; }

          function addWatermark(ctx, width, height, lines) {
            if (!lines || lines.length === 0) return;
            ctx.save();
            ctx.globalAlpha = 0.15;
            ctx.translate(width / 2, height / 2);
            ctx.rotate(-Math.PI / 4);
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            const fontSize = Math.min(width, height) / 12;
            ctx.font = fontSize + "px sans-serif";
            ctx.fillStyle = "#000";
            const lineHeight = fontSize * 1.2;
            const totalHeight = lines.length * lineHeight;
            const startY = -totalHeight / 2 + lineHeight / 2;
            lines.forEach((line, index) => {
              ctx.fillText(line, 0, startY + index * lineHeight);
            });
            ctx.restore();
          }

          function applyScanEffect(baseCanvas, options = {}) {
            const { margin = 30, maxAngleDeg = 2, tintValue = 0, enableRotation = true } = options;
            const srcW = baseCanvas.width;
            const srcH = baseCanvas.height;
            const outW = srcW + margin * 2;
            const outH = srcH + margin * 2;
            const outCanvas = document.createElement("canvas");
            outCanvas.width = outW;
            outCanvas.height = outH;
            const ctx = outCanvas.getContext("2d");
            ctx.fillStyle = "#f6f6f6";
            ctx.fillRect(0, 0, outW, outH);
            const angleRad = enableRotation ? ((Math.random() - 0.5) * maxAngleDeg * Math.PI) / 180 : 0;
            ctx.save();
            ctx.translate(outW / 2, outH / 2);
            ctx.rotate(angleRad);
            ctx.drawImage(baseCanvas, -srcW / 2, -srcH / 2);
            ctx.restore();
            if (tintValue > 0) {
              const alpha = tintValue / 250;
              ctx.fillStyle = \`rgba(255, 255, 200, \${alpha})\`;
              ctx.fillRect(0, 0, outW, outH);
            }
            return outCanvas;
          }

          startBtn.addEventListener("click", async () => {
            if (!window.libsLoaded) {
              alert('核心库加载失败，请尝试切换 CDN 源并刷新页面。');
              return;
            }
            try {
              if (!fileInput.files || fileInput.files.length === 0) {
                alert("请先选择一个 PDF 文件。");
                return;
              }
              const file = fileInput.files[0];
              if (file.type !== "application/pdf") {
                alert("只支持 PDF 文件。");
                return;
              }
              
              const watermarkLinesCount = parseInt(watermarkLinesInput.value, 10) || 0;
              const watermarkTexts = [];
              if (watermarkLinesCount > 0) {
                const inputs = document.querySelectorAll('#watermarkInputs .watermark-text');
                for (const input of inputs) {
                  if (!input.value.trim()) {
                    alert('所有水印文本框都不能为空。');
                    return;
                  }
                  watermarkTexts.push(input.value.trim());
                }
              }

              let scale = parseFloat(scaleInput.value);
              if (!Number.isFinite(scale) || scale <= 0) scale = 2;
              const tintValue = parseInt(tintInput.value, 10);
              const enableRotation = rotationInput.checked;

              startBtn.disabled = true;
              log("读取 PDF 文件...");
              progressEl.style.display = "block";
              progressEl.value = 0;
              const arrayBuffer = await file.arrayBuffer();
              log("正在解析 PDF...");
              const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
              const pdfDoc = await loadingTask.promise;
              const numPages = pdfDoc.numPages;
              progressEl.max = numPages;
              let finalPdf = null;
              const { jsPDF } = window.jspdf;

              for (let pageNum = 1; pageNum <= numPages; pageNum++) {
                log(\`正在处理第 \${pageNum} / \${numPages} 页...\`);
                const page = await pdfDoc.getPage(pageNum);
                const viewport = page.getViewport({ scale: scale });
                const baseCanvas = document.createElement("canvas");
                baseCanvas.width = viewport.width;
                baseCanvas.height = viewport.height;
                await page.render({ canvasContext: baseCanvas.getContext("2d"), viewport: viewport }).promise;
                const scannedCanvas = applyScanEffect(baseCanvas, { tintValue, enableRotation });
                if (watermarkTexts.length > 0) {
                  addWatermark(scannedCanvas.getContext("2d"), scannedCanvas.width, scannedCanvas.height, watermarkTexts);
                }
                const imgData = scannedCanvas.toDataURL("image/jpeg", 0.9);
                const { width, height } = scannedCanvas;
                const orientation = width > height ? "l" : "p";
                if (!finalPdf) {
                  finalPdf = new jsPDF({ unit: "pt", format: [width, height] });
                } else {
                  finalPdf.addPage([width, height], orientation);
                }
                finalPdf.addImage(imgData, "JPEG", 0, 0, width, height);
                progressEl.value = pageNum;
              }
              if (!finalPdf) throw new Error("未能生成任何 PDF 页面。");
              log("正在合成最终的 PDF...");
              const outName = (file.name || "document").replace(/\\.pdf$/i, "") + "_scanned.pdf";
              finalPdf.save(outName);
              log("完成，已触发下载：" + outName);
            } catch (e) {
              console.error(e);
              log("出错：" + e.message);
              alert("出错：" + e.message);
            } finally {
              startBtn.disabled = false;
              progressEl.style.display = "none";
            }
          });
          initializeApp();
        `;
        document.body.appendChild(mainModule);
      };
      jspdfScript.onerror = () => {
          console.error('jsPDF 库加载失败，请检查网络或切换 CDN。');
      };
      document.body.appendChild(jspdfScript);
    })();
  </script>
</body>
</html>
